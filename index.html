<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js" defer></script>
</head>
<body>
    <header>
        <img src="./imgs/logo.png" class="logo" alt="Logo Lion School">
        <div class="btn-sair">
            <img src="./imgs/sair.png" class="sair" alt="Ícone Sair">
            <h2 class="sairTxt">Sair</h2>
        </div>
    </header>

    <main>
        
    </main>

    <footer>
        <div class="contatos">
            <!-- Telefone -->
            <div class="item-contato">
                <img src="./imgs/telefone.png" class="icon-footer" alt="Icon Telefone">
                <p class="contatoTxt">(11) 99999-9999</p>
            </div>

            <!-- Email -->
            <div class="item-contato">
                <img src="./imgs/email.png" class="icon-footer" alt="Icon Email">
                <p class="contatoTxt">contato@lionschool.com</p>
            </div>

            <!-- Mapa -->
            <div class="item-contato">
                <img src="./imgs/mapa.png" class="icon-footer" alt="Icon Mapa">
                <p class="contatoTxt">Rua Exemplo, 123 - São Paulo/SP</p>
            </div>
        </div>

        <p class="copyright">Copyright © 2026 | Jean Costa</p>

        <div class="redes-sociais">
            <img src="./imgs/social-media.png" class="icon-social" alt="Icon Social Media">
        </div>
    </footer>
</body>
</html>
